name: Build and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository and history for secrets
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          docker compose --env-file infra/compose/.env.example -f infra/compose/docker-compose.yml config >/tmp/genesis-compose.yml
          docker compose --env-file infra/monitoring/.env.example -f infra/monitoring/docker-compose.monitoring.yml config >/tmp/genesis-monitoring.yml
          docker compose --env-file infra/logging/.env.example -f infra/logging/docker-compose.logging.yml config >/tmp/genesis-logging.yml

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m unittest discover -s scripts/tests

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/app:/app:ro" php:8.3-cli-alpine@sha256:e7699f91d3b46283a49bde02379266dd98d87844e08aed1ff7ea6a7d1f031268 \
            sh -c "find /app -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l"

      - name: Validate DMA authorization and PHP syntax
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/repo:ro" \
            php:8.3-cli-alpine@sha256:e7699f91d3b46283a49bde02379266dd98d87844e08aed1ff7ea6a7d1f031268 \
            sh -ec 'find /repo/dma -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l; php /repo/scripts/tests/dma-write-auth.php'

      - name: Build application image
        run: |
          docker build -t genesis-app:${{ github.sha }} app
          docker build -t genesis-dma:${{ github.sha }} dma

      - name: Scan application images
        run: |
          set -euo pipefail
          mkdir -p .scan
          for image in genesis-app genesis-dma; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity CRITICAL --format json --exit-code 0 \
              "$image:$GITHUB_SHA" > ".scan/$image.json"
            count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' ".scan/$image.json")
            echo "$image critical findings: $count" >> "$GITHUB_STEP_SUMMARY"
            if (( count > 0 )); then
              echo "::warning::$image has $count critical vulnerability findings; see vulnerability-reports."
            fi
          done

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-reports
          path: .scan/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Create release bundle
        run: |
          set -euo pipefail
          mkdir -p .release/payload
          paths=()
          for path in app dma infra scripts docs .github README.md .gitignore .env.example; do
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              paths+=("$path")
            fi
          done
          git archive --format=tar HEAD -- "${paths[@]}" | tar -xf - -C .release/payload
          printf '%s\n' "$GITHUB_SHA" > .release/payload/app/public/deploy-version.txt
          tar -C .release/payload -czf .release/release.tgz .
          (cd .release && sha256sum release.tgz > SHA256SUMS)

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            .release/release.tgz
            .release/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: .release

      - name: Publish deployment release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd .release && sha256sum --check --strict SHA256SUMS)
          tag="deploy-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:12}"
          gh release create "$tag" .release/release.tgz .release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$tag" --notes "Deployment commit $GITHUB_SHA"

  verify:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read

    steps:
      - name: Checkout verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Wait for host deployment confirmation
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if receipt=$(curl --fail --silent --connect-timeout 4 --max-time "$((remaining < 8 ? remaining : 8))" \
              --header 'Cache-Control: no-cache' "https://shellr.net/deployed.json?sha=$GITHUB_SHA"); then
              if jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and (.verified_at | fromdateiso8601 > 0)' <<< "$receipt" >/dev/null 2>&1; then
                echo "Deployment verified at $GITHUB_SHA"
                exit 0
              fi
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep "$((remaining < 10 ? remaining : 10))"
            fi
          done
          echo "The host did not confirm the deployment within fifteen minutes." >&2
          exit 1
      - name: Verify public security headers
        run: python3 scripts/check-security-headers.py
      - name: Verify public DMA boundary
        run: python3 scripts/check-dma-boundary.py
