name: Build and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          docker compose --env-file infra/compose/.env.example -f infra/compose/docker-compose.yml config >/tmp/genesis-compose.yml
          docker compose --env-file infra/monitoring/.env.example -f infra/monitoring/docker-compose.monitoring.yml config >/tmp/genesis-monitoring.yml
          docker compose --env-file infra/logging/.env.example -f infra/logging/docker-compose.logging.yml config >/tmp/genesis-logging.yml

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/app:/app:ro" php:8.3-cli-alpine \
            sh -c "find /app -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l"

      - name: Build application image
        run: docker build -t genesis-app:${{ github.sha }} app

      - name: Create release bundle
        run: |
          set -euo pipefail
          mkdir -p .release/payload
          paths=()
          for path in app dma infra scripts docs .github README.md .gitignore .env.example; do
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              paths+=("$path")
            fi
          done
          git archive --format=tar HEAD -- "${paths[@]}" | tar -xf - -C .release/payload
          printf '%s\n' "$GITHUB_SHA" > .release/payload/app/public/deploy-version.txt
          tar -C .release/payload -czf .release/release.tgz .
          (cd .release && sha256sum release.tgz > SHA256SUMS)

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            .release/release.tgz
            .release/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: .release

      - name: Publish deployment release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd .release && sha256sum --check --strict SHA256SUMS)
          tag="deploy-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:12}"
          gh release create "$tag" .release/release.tgz .release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$tag" --notes "Deployment commit $GITHUB_SHA"

  verify:
    runs-on: ubuntu-latest
    needs: publish
    permissions: {}

    steps:
      - name: Wait for the published version
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if version=$(curl --fail --silent --connect-timeout 4 --max-time "$((remaining < 8 ? remaining : 8))" \
              --header 'Cache-Control: no-cache' "https://shellr.net/deploy-version.txt?sha=$GITHUB_SHA"); then
              if [[ "$version" == "$GITHUB_SHA" ]]; then
                echo "Deployment verified at $GITHUB_SHA"
                exit 0
              fi
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep "$((remaining < 10 ? remaining : 10))"
            fi
          done
          echo "The published commit did not become live within ten minutes." >&2
          exit 1
