name: docs-site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-site.yml"
      - "scripts/check-docs-links.py"
      - "scripts/tests/test_docs_links.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify static docs
        run: |
          test -f docs/site/index.html
          test -f docs/site/CNAME
          ! rg -n -i "schowo|sinna" docs/site
          python3 scripts/check-docs-links.py docs/site
          python3 -m unittest discover -s scripts/tests -p test_docs_links.py
