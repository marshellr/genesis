name: docs-site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify static docs
        run: |
          test -f docs/site/index.html
          test -f docs/site/CNAME
          ! rg -n -i "schowo|sinna" docs/site
