server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dma.shellr.net;

    include /etc/nginx/snippets/tls_common.conf;
    include /etc/nginx/snippets/security_headers.conf;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/shellr/dma;
        try_files $uri $uri/ /index.html;
    }
}
