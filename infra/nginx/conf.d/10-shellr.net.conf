server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shellr.net;
    # Service aliases such as app are shared by multiple Compose projects.
    set $shellr_backend http://genesis-app:80;

    include /etc/nginx/snippets/tls_common.conf;
    include /etc/nginx/snippets/shellr_security_headers.conf;
    add_header Cache-Control "no-cache" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /deployed.json {
        alias /usr/share/nginx/html/shellr/local/deployed.json;
        default_type application/json;
        log_not_found off;
        expires off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/shellr_security_headers.conf;
    }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/shellr_security_headers.conf;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass $shellr_backend;
    }

    location = /dma {
        return 301 https://dma.shellr.net/;
    }

    location ^~ /dma/ {
        rewrite ^/dma/(.*)$ https://dma.shellr.net/$1 permanent;
    }

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass $shellr_backend;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shellr.net;

    include /etc/nginx/snippets/tls_common.conf;

    return 301 https://shellr.net$request_uri;
}
