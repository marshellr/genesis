server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shellr.net;
    # Service aliases such as app are shared by multiple Compose projects.
    set $shellr_backend http://genesis-app:80;

    include /etc/nginx/snippets/tls_common.conf;
    include /etc/nginx/snippets/security_headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass $shellr_backend;
    }

    location = /dma {
        return 301 https://dma.shellr.net/;
    }

    location ^~ /dma/ {
        rewrite ^/dma/(.*)$ https://dma.shellr.net/$1 permanent;
    }

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        # Bypass browser caches populated with assets from the wrong app.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '"/assets/app.js"' '"/assets/app.js?v=20261028-routing"';
        sub_filter '"/assets/favi.png"' '"/assets/favi.png?v=20261028-routing"';
        sub_filter '"/assets/fonts.css"' '"/assets/fonts.css?v=20261028-routing"';
        sub_filter '"/assets/logo-small.png"' '"/assets/logo-small.png?v=20261028-routing"';
        sub_filter '"/assets/styles.css"' '"/assets/styles.css?v=20261028-routing"';
        proxy_pass $shellr_backend;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shellr.net;

    include /etc/nginx/snippets/tls_common.conf;

    return 301 https://shellr.net$request_uri;
}
