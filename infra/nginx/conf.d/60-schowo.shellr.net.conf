server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name schowo.shellr.net sinna.shellr.net;

    include /etc/nginx/snippets/tls_common.conf;
    include /etc/nginx/snippets/legacy_security_headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location ^~ /_app/immutable/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/legacy_security_headers.conf;
        include /etc/nginx/snippets/proxy_common.conf;
        return 410;
    }

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        return 410;
    }
}
