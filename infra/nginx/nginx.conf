load_module /etc/nginx/modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    js_import access_log from /etc/nginx/snippets/access_log.js;
    js_set $peer_prefix access_log.peerPrefix;
    js_set $forwarded_prefixes access_log.forwardedPrefixes;

    # Exclude raw request and header text, which can contain unmasked addresses.
    log_format main escape=json '{"time":"$time_iso8601","site":"$server_name",'
                                '"peer":"$peer_prefix","forwarded_for":"$forwarded_prefixes",'
                                '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';

    access_log  /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    types_hash_max_size 4096;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    client_max_body_size 10m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    include /etc/nginx/conf.d/*.conf;
}
