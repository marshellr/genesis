/projects/genesis/infra/docker/volumes/uptime-kuma/error.log {
    size 10M
    rotate 3
    missingok
    notifempty
    compress
    copytruncate
    su root root
}

/projects/genesis/infra/backup/logs/*.log {
    size 10M
    rotate 4
    missingok
    notifempty
    compress
    copytruncate
    su shellr shellr
}
