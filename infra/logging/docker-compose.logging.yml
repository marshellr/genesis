name: genesis-logging

services:
  loki:
    image: grafana/loki:3.6.0
    container_name: genesis-logging-loki
    command:
      - -config.file=/etc/loki/config.yml
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT:-/projects/genesis}/infra/logging/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.19.0@sha256:c958aef7294bc40c67caadb2bcecc93b95ab7961ff8afae3abee170d77426193
    container_name: genesis-logging-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ${PROJECT_ROOT:-/projects/genesis}/infra/logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_ROOT:-/projects/genesis}/infra/docker/volumes/loki/data

  alloy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_ROOT:-/projects/genesis}/infra/docker/volumes/loki/alloy

networks:
  monitoring:
    external: true
    name: genesis_monitoring
